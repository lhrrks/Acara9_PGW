<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Input Data Hidran Kering</title>
</head>
<body>
    <h2>Form Tambah Data Hidran Kering</h2>
    
    <form action="input.php" method="post" onsubmit="return validateForm()">
        <label for="ogc_fid">OGC FID:</label><br>
        <input type="number" id="ogc_fid" name="ogc_fid" required><br><br>

        <label for="no">No:</label><br>
        <input type="number" id="no" name="no" required><br><br>

        <label for="nama_kode">Nama Kode:</label><br>
        <input type="text" id="nama_kode" name="nama_kode" required><br><br>

        <label for="alamat">Alamat:</label><br>
        <input type="text" id="alamat" name="alamat" required><br><br>

        <label for="status">Status:</label><br>
        <input type="text" id="status" name="status" value="Berfungsi" required><br><br>

        <label for="longitude">Longitude:</label><br>
        <input type="text" id="long" name="longitude" required><br><br>

        <label for="latitude">Latitude:</label><br>
        <input type="text" id="lat" name="latitude" required><br><br>

        <input type="submit" value="Simpan Data">
        <a href="../index.php"><button type="button">Batal</button></a>
    </form>

    <p id="informasi" style="color: red;"></p>

    <script>
    function validateForm() {
        let long = document.getElementById("long").value;
        let lat = document.getElementById("lat").value;
        let text = "";

        if (isNaN(long) || isNaN(lat)) {
            text = "Koordinat (Longitude & Latitude) harus berupa angka!";
            document.getElementById("informasi").innerHTML = text;
            return false;
        }
        return true;
    }
    </script>
</body>
</html>
